spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/todo}
    username: ${DATABASE_USERNAME:todo}
    password: ${DATABASE_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
