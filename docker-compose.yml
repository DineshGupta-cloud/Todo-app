services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    volumes: [todo-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U todo -d todo"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/todo
      DATABASE_USERNAME: todo
      DATABASE_PASSWORD: todo
      CORS_ORIGIN: http://localhost
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [api]
volumes:
  todo-data:
